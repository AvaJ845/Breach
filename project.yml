name: BreachKit
options:
  bundleIdPrefix: com.avaresearch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      ENABLE_TESTABILITY: NO
targets:
  BreachKit:
    type: application
    platform: iOS
    sources:
      - path: BreachKit
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
          - "Info.plist"
          - "Resources/Legal/**"
      - path: BreachKit/Resources/Legal
        buildPhase: resources
        type: folder
    info:
      path: BreachKit/Info.plist
      properties:
        CFBundleDisplayName: Breach Kit
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHumanReadableCopyright: "Privacy-first breach & settlement tracking."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_NAME: BreachKit
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.breachkit
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    postBuildScripts:
      - name: Strip extended attributes (codesign detritus)
        script: /usr/bin/xattr -rc "${CODESIGNING_FOLDER_PATH}"
        basedOnDependencyAnalysis: false
  BreachKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BreachKitTests
    dependencies:
      - target: BreachKit
    settings:
      base:
        PRODUCT_NAME: BreachKitTests
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.breachkit.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BreachKit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BreachKit"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BreachKit:
    build:
      targets:
        BreachKit: all
        BreachKitTests: [test]
    test:
      config: Debug
      targets:
        - BreachKitTests
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
